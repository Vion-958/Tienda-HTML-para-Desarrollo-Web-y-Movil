# ChocoManía - Semana 13: Auth Service + Vault + Backend + API Gateway +
# Frontend (Semana 9) + broker de mensajería ActiveMQ (Semana 13)
#
#   1. copy .env.example .env        (Linux/macOS: cp .env.example .env)
#   2. docker compose up --build
#   3. abrir http://localhost:8000          (tienda)
#      abrir http://localhost:8161/admin    (consola de ActiveMQ)
#
# Solo el broker, para la práctica de mensajería:
#   docker compose up -d activemq
#
# Los secretos NO están escritos aquí: se leen del archivo .env, que no se
# sube a Git (.gitignore). vault-init los guarda en Vault al arrancar.

services:
  vault:
    image: hashicorp/vault:1.17
    container_name: vault-dev
    ports:
      - "8200:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_TOKEN:?Falta VAULT_TOKEN en .env}
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
    cap_add:
      - IPC_LOCK
    healthcheck:
      test: ["CMD", "vault", "status", "-address=http://127.0.0.1:8200"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Carga los secretos entre servicios en Vault y termina.
  vault-init:
    image: hashicorp/vault:1.17
    depends_on:
      vault:
        condition: service_healthy
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: ${VAULT_TOKEN}
    entrypoint: ["vault"]
    command:
      - kv
      - put
      - secret/gateway
      - backend_shared_secret=${BACKEND_SHARED_SECRET:?Falta BACKEND_SHARED_SECRET en .env}
      - auth_introspection_secret=${AUTH_INTROSPECTION_SECRET:?Falta AUTH_INTROSPECTION_SECRET en .env}
    restart: "no"

  auth:
    build: ./auth-service
    ports:
      - "8100:8100"
    environment:
      AUTH_INTROSPECTION_SECRET: ${AUTH_INTROSPECTION_SECRET}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-900}

  backend:
    build: ./backend-api
    ports:
      - "9000:9000"
    environment:
      INTERNAL_GATEWAY_SECRET: ${BACKEND_SHARED_SECRET}

  # El sitio PHP no publica puerto: solo se llega a él a través del Gateway.
  frontend:
    image: php:8.3-cli
    working_dir: /var/www
    volumes:
      - ./chocomania-frontend:/var/www:ro
    command: ["php", "-S", "0.0.0.0:8080", "-t", "/var/www"]

  gateway:
    build: ./api-gateway
    ports:
      - "8000:8000"
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: ${VAULT_TOKEN}
      AUTH_URL: http://auth:8100
      BACKEND_URL: http://backend:9000
      FRONTEND_URL: http://frontend:8080
    depends_on:
      vault-init:
        condition: service_completed_successfully
      auth:
        condition: service_started
      backend:
        condition: service_started
      frontend:
        condition: service_started

  # Broker de mensajería (Semana 13). Lo usan mensajeria/productor.py y
  # mensajeria/consumidor.py por STOMP en el puerto 61613.
  activemq:
    image: apache/activemq-classic:6.1.4
    container_name: chocomania-activemq
    ports:
      - "61613:61613"   # STOMP
      - "61616:61616"   # OpenWire
      - "8161:8161"     # consola web (admin / admin)
    environment:
      ACTIVEMQ_CONNECTION_USER: ${ACTIVEMQ_USER:-demo}
      ACTIVEMQ_CONNECTION_PASSWORD: ${ACTIVEMQ_PASSWORD:-demo123}
